name: Daily Stock Quant Scan

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quant_scan:
    runs-on: ubuntu-latest

    steps:
    - name: 1. 檢查並載入程式碼
      uses: actions/checkout@v4

    - name: 2. 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. 安裝 Linux 系統中文字型 (防止 K 線圖中文變亂碼框框)
      run: |
        sudo apt-get update
        sudo apt-get install -y fonts-noto-cjk

    - name: 4. 安裝必要套件清單
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 5. 執行全市場策略掃描
      run: python Master_Scanner.py

    - name: 6. 自動將今日產出的圖表與 Excel 推回倉庫
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add .
        git diff --quiet && git diff --staged --quiet || (git commit -m "雲端排程自動更新數據" && git push)
